[project]
name = "r-chatbot"
version = "0.1.0"
description = "Chatbot de consola que funciona como anfitrion MCP: conecta un LLM con varios servidores MCP. Es parte del curso de Redes UVG."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0,<2.0.0",
    "anthropic>=1.4.0",
    "python-dotenv>=1.0.0",
    "mcp-server-git>=2025.1.0",
]

[project.scripts]
chatbot-redes = "src.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]